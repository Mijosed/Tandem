services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.matomo.address=:8890"
    ports:
      - "8888:80"
      - "8081:8080"
      - "8890:8890"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tandem-network

  # 🐘 PostgreSQL pour Symfony
  database:
    image: postgres:17
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tandem
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-postgres:/01-create-matomo-db.sql
    networks:
      - tandem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🐬 MariaDB pour Matomo
  matomo-db:
    image: mariadb:10.11
    container_name: matomo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matomo
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - matomo-db-data:/var/lib/mysql
    networks:
      - tandem-network

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    networks:
      - tandem-network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - tandem-network

  nginx-back:
    image: nginx:alpine
    container_name: nginx-back
    volumes:
      - ./backend:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.symfony.rule=PathPrefix(`/api`) || PathPrefix(`/bundles`)"
      - "traefik.http.services.symfony.loadbalancer.server.port=80"
      - "traefik.http.routers.symfony.entrypoints=web"

  matomo:
    image: matomo:latest
    container_name: matomo
    restart: always
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_ADAPTER=PDO\MYSQL
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - MATOMO_DATABASE_USERNAME=admin
      - MATOMO_DATABASE_PASSWORD=admin
      - MATOMO_DATABASE_DBNAME=matomo
      - APACHE_SERVER_NAME=matomo.localhost
    depends_on:
      - matomo-db
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matomo.rule=Host(`localhost`)"
      - "traefik.http.routers.matomo.entrypoints=matomo"
      - "traefik.http.services.matomo.loadbalancer.server.port=80"
    volumes:
      - matomo-data:/var/www/html

  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuxt
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: "npm run dev -- --host"
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nuxt.rule=PathPrefix(`/`) && !PathPrefix(`/api`, `/bundles`)"
      - "traefik.http.services.nuxt.loadbalancer.server.port=3000"
      - "traefik.http.routers.nuxt.entrypoints=web"
    env_file:
      - ./frontend/.env

  # 📧 MailHog pour tester les emails
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: always
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Interface web
    networks:
      - tandem-network

volumes:
  db-data:
  matomo-data:
  matomo-db-data:

networks:
  tandem-network:
