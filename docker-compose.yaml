services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/var/www/frontend
      - ./backend/public:/var/www/backend/public
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/var/www/frontend
      - /var/www/frontend/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - API_BASE=http://backend:8000/api
      - VITE_DEV_SERVER_PORT=3000
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - VITE_DEV_SERVER_HTTPS=false
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
      - "24678:24678" # Port pour le HMR de Vite
    networks:
      - app-network

  backend:
    build:
      context: ./docker/php
    container_name: backend
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - DATABASE_URL=postgresql://symfony:symfony@db:5432/symfony
    command: sh -c "composer install && symfony server:start --port=8000 --allow-http --no-tls --listen-ip=0.0.0.0"
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - app-network


  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: symfony
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: symfony
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:

volumes:
  db_data:
