services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certificates[0].certFile=/certs/fullchain1.pem"
      - "--entrypoints.websecure.http.tls.certificates[0].keyFile=/certs/privkey1.pem"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/archive/tandems.social:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tandem-network

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.tandems.social`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"

  database:
    image: postgres:17
    container_name: database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tandem
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tandem-network

  matomo-db:
    image: mariadb:10.11
    container_name: matomo-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matomo
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - matomo-db-data:/var/lib/mysql
    networks:
      - tandem-network

  php:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - tandem-network

  nginx-back:
    image: nginx:alpine
    container_name: nginx-back
    volumes:
      - ./backend:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.tandems.social`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=80"

  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuxt
    environment:
      - NODE_ENV=production
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nuxt.rule=Host(`tandems.social`) || Host(`www.tandems.social`)"
      - "traefik.http.routers.nuxt.entrypoints=websecure"
      - "traefik.http.routers.nuxt.tls=true"
      - "traefik.http.services.nuxt.loadbalancer.server.port=3000"
    env_file:
      - ./frontend/.env

  matomo:
    image: matomo:latest
    container_name: matomo
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_USERNAME=admin
      - MATOMO_DATABASE_PASSWORD=admin
      - MATOMO_DATABASE_DBNAME=matomo
    depends_on:
      - matomo-db
    volumes:
      - matomo-data:/var/www/html
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.tandems.social`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`mail.tandems.social`)"
      - "traefik.http.routers.mail.entrypoints=websecure"
      - "traefik.http.routers.mail.tls=true"
      - "traefik.http.services.mail.loadbalancer.server.port=8025"

volumes:
  db-data:
  matomo-db-data:
  matomo-data:

networks:
  tandem-network:
