services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tandem-network

  database:
    image: postgres:17
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tandem
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tandem-network

  matomo-db:
    image: mariadb:10.11
    container_name: matomo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matomo
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - matomo-db-data:/var/lib/mysql
    networks:
      - tandem-network

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`admin.tandems.social`)"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - tandem-network

  symfony:
    image: nginx:alpine
    container_name: symfony
    volumes:
      - ./backend:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.tandems.social`)"
      - "traefik.http.services.api.loadbalancer.server.port=80"

  matomo:
    image: matomo:latest
    container_name: matomo
    restart: always
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_ADAPTER=PDO\MYSQL
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - MATOMO_DATABASE_USERNAME=admin
      - MATOMO_DATABASE_PASSWORD=admin
      - MATOMO_DATABASE_DBNAME=matomo
    depends_on:
      - matomo-db
    networks:
      - tandem-network
    volumes:
      - matomo-data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matomo.rule=Host(`matomo.tandems.social`)"
      - "traefik.http.services.matomo.loadbalancer.server.port=80"

  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuxt
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: "npm run build && npm run start"
    environment:
      - NODE_ENV=production
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.rule=Host(`tandems.social`) || Host(`www.tandems.social`)"
      - "traefik.http.services.front.loadbalancer.server.port=3000"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: always
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mail.tandems.social`)"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

volumes:
  db-data:
  matomo-data:
  matomo-db-data:

networks:
  tandem-network:
