services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tandem-network
    labels:
      - "traefik.enable=false"

  database:
    image: postgres:17
    container_name: database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tandem
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tandem-network

  matomo-db:
    image: mariadb:10.11
    container_name: matomo-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matomo
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - matomo-db-data:/var/lib/mysql
    networks:
      - tandem-network

  php:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - tandem-network

  nginx-back:
    image: nginx:alpine
    container_name: nginx-back
    volumes:
      - ./backend:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      # HTTPS router - Utiliser le même domaine que le frontend avec un path
      - "traefik.http.routers.api.rule=Host(`tandems.social`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=80"
      # HTTP router (redirect to HTTPS)
      - "traefik.http.routers.api-http.rule=Host(`tandems.social`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api-http.entrypoints=web"
      - "traefik.http.routers.api-http.middlewares=api-redirect"
      - "traefik.http.middlewares.api-redirect.redirectscheme.scheme=https"

  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuxt
    environment:
      - NODE_ENV=production
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.nuxt.rule=Host(`tandems.social`) || Host(`www.tandems.social`)"
      - "traefik.http.routers.nuxt.entrypoints=websecure"
      - "traefik.http.routers.nuxt.tls=true"
      - "traefik.http.services.nuxt.loadbalancer.server.port=3000"
      # HTTP router (redirect to HTTPS)
      - "traefik.http.routers.nuxt-http.rule=Host(`tandems.social`) || Host(`www.tandems.social`)"
      - "traefik.http.routers.nuxt-http.entrypoints=web"
      - "traefik.http.routers.nuxt-http.middlewares=nuxt-redirect"
      - "traefik.http.middlewares.nuxt-redirect.redirectscheme.scheme=https"
    env_file:
      - ./frontend/.env

