version: '3.9'

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.leresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.leresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.leresolver.acme.email=admin@tandems.social"
      - "--certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - tandem-network

  database:
    image: postgres:17
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tandem
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tandem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tandem"]
      interval: 5s
      timeout: 5s
      retries: 5

  matomo-db:
    image: mariadb:10.11
    container_name: matomo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matomo
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - matomo-db-data:/var/lib/mysql
    networks:
      - tandem-network

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    networks:
      - tandem-network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - tandem-network

  symfony:
    image: nginx:alpine
    container_name: symfony
    volumes:
      - ./backend:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.tandems.social`)"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.routers.api.tls.certresolver=leresolver"
      - "traefik.http.services.api.loadbalancer.server.port=80"

  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuxt
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    command: "npm run build && npm run preview"
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nuxt.rule=Host(`tandems.social`, `www.tandems.social`)"
      - "traefik.http.routers.nuxt.entrypoints=web"
      - "traefik.http.services.nuxt.loadbalancer.server.port=3000"

    env_file:
      - ./frontend/.env

  matomo:
    image: matomo:latest
    container_name: matomo
    restart: always
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_ADAPTER=PDO\MYSQL
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - MATOMO_DATABASE_USERNAME=admin
      - MATOMO_DATABASE_PASSWORD=admin
      - MATOMO_DATABASE_DBNAME=matomo
    depends_on:
      - matomo-db
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matomo.rule=Host(`matomo.tandems.social`)"
      - "traefik.http.routers.matomo.entrypoints=web,websecure"
      - "traefik.http.routers.matomo.tls.certresolver=leresolver"
      - "traefik.http.services.matomo.loadbalancer.server.port=80"
    volumes:
      - matomo-data:/var/www/html

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: always
    networks:
      - tandem-network

volumes:
  db-data:
  matomo-data:
  matomo-db-data:

networks:
  tandem-network:
