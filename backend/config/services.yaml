# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    pole_emploi.client_id: '%env(POLE_EMPLOI_CLIENT_ID)%'
    pole_emploi.client_secret: '%env(POLE_EMPLOI_CLIENT_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\DataFixtures\Provider\HashPasswordProvider:
        tags: [ { name: nelmio_alice.faker.provider } ]

    # Configuration du service de géolocalisation
    App\Service\GeolocationService:
        # Pas d'arguments supplémentaires nécessaires

    # Configuration du service Pôle Emploi
    App\Service\PoleEmploiService:
        arguments:
            $poleEmploiClientId: '%pole_emploi.client_id%'
            $poleEmploiClientSecret: '%pole_emploi.client_secret%'

    # Configuration du processor pour les notifications
    App\State\NotificationProcessor:
        arguments:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
        tags:
            - { name: 'api_platform.state.processor' }

    # Service d'envoi d'emails pour les notifications
    App\Service\NotificationEmailService:
        arguments:
            $mailer: '@mailer.mailer'
            $twig: '@twig'
            $parameterBag: '@parameter_bag'
