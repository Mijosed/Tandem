tls:
  certificates:
    - certFile: /letsencrypt/fullchain.pem
      keyFile: /letsencrypt/privkey.pem
      stores:
        - default
  stores:
    default:
      defaultCertificate:
        certFile: /letsencrypt/fullchain.pem
        keyFile: /letsencrypt/privkey.pem
  options:
    default:
      sslProtocols:
        - "TLSv1.2"
        - "TLSv1.3"
