services:
  # 🔁 Reverse proxy
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8888:80"     # Reverse proxy (traefik) exposé sur localhost:8888
      - "8081:8080"   # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tandem-network

  # 🐘 PostgreSQL Database
  database:
    image: postgres:17
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: !ChangeMe!
      POSTGRES_DB: tandem
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tandem-network

  # 🛠 Adminer
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    networks:
      - tandem-network

  # 🧠 Symfony PHP (FPM)
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - tandem-network

  # 🌐 Nginx pour Symfony (parle à PHP-FPM)
  nginx-back:
    image: nginx:alpine
    container_name: nginx-back
    volumes:
      - ./backend:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.symfony.rule=PathPrefix(`/api`) || PathPrefix(`/bundles`)"
      - "traefik.http.services.symfony.loadbalancer.server.port=80"
      - "traefik.http.routers.symfony.entrypoints=web"

  # 🌐 Nuxt (dev mode)
  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuxt
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: "npm run dev -- --host"
    networks:
      - tandem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nuxt.rule=PathPrefix(`/`) && !PathPrefix(`/api`, `/bundles`)"
      - "traefik.http.services.nuxt.loadbalancer.server.port=3000"
      - "traefik.http.routers.nuxt.entrypoints=web"

volumes:
  db-data:

networks:
  tandem-network:
